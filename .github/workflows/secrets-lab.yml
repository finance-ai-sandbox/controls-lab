name: secrets-lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Which secrets reach a job with no environment
        env:
          ORG_S: ${{ secrets.LAB_ORG_SECRET }}
          REPO_S: ${{ secrets.LAB_REPO_SECRET }}
          ENV_S: ${{ secrets.LAB_ENV_SECRET }}
        run: |
          echo "| Secret | Job: no-environment |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for name in ORG_S REPO_S ENV_S; do
            if [ -n "${!name}" ]; then status="present"; else status="EMPTY - not available"; fi
            echo "$name: $status"
            echo "| $name | $status |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Masking test - repo secret printed directly: $REPO_S"

  production-step:
    needs: no-environment
    runs-on: ubuntu-latest
    environment: client-production
    steps:
      - name: Which secrets reach the approved environment job
        env:
          ORG_S: ${{ secrets.LAB_ORG_SECRET }}
          REPO_S: ${{ secrets.LAB_REPO_SECRET }}
          ENV_S: ${{ secrets.LAB_ENV_SECRET }}
        run: |
          echo "| Secret | Job: production-step |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for name in ORG_S REPO_S ENV_S; do
            if [ -n "${!name}" ]; then status="present"; else status="EMPTY - not available"; fi
            echo "$name: $status"
            echo "| $name | $status |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Masking test - environment secret printed directly: $ENV_S"
